name: Update MiGu EPL playlist

on:
  workflow_dispatch:
  push:
    paths:
      - "iptv/update_migu_epl.py"
      - ".github/workflows/update-migu-epl.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate EPL playlist
        run: python3 iptv/update_migu_epl.py

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iptv/migu-epl.m3u
          if git diff --cached --quiet; then
            echo "No playlist changes"
            exit 0
          fi
          git commit -m "Update MiGu EPL playlist"
          git push
